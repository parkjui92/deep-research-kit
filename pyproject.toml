[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deep-research-kit"
version = "0.3.0"
description = "Traceable literature research with a review UI and agent skills"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "streamlit>=1.45,<2",
  "streamlit-pdf-viewer==0.0.30",
  "pdfplumber>=0.11,<1",
  "PyYAML>=6,<7",
  "filelock>=3.16,<4",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "reportlab>=4,<5"]

[project.scripts]
drk = "deep_research.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["deep_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
