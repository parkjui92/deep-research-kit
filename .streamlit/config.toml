[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6FA"
textColor = "#1F2937"
linkColor = "#4F46E5"
borderColor = "#D6D9E3"
dataframeBorderColor = "#D6D9E3"
dataframeHeaderBackgroundColor = "#F0F1F7"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "8px"
buttonRadius = "8px"
baseFontSize = 16
font = "Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"
headingFont = "Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"
headingFontWeights = [700, 700, 700, 600, 600, 600]
greenColor = "#16A34A"
orangeColor = "#D97706"
blueColor = "#4F46E5"
redColor = "#B91C1C"
grayColor = "#6B7280"

# Pretendard (SIL OFL 1.1), Korean + Latin subset bundled in static/fonts so the
# classroom looks the same offline. Falls back to the system Korean font.
[[theme.fontFaces]]
family = "Pretendard"
url = "app/static/fonts/Pretendard-Regular.woff2"
weight = 400

[[theme.fontFaces]]
family = "Pretendard"
url = "app/static/fonts/Pretendard-Bold.woff2"
weight = 700

# Dark navy step rail on the left, white workspace on the right (0.2.1).
[theme.sidebar]
backgroundColor = "#111A2E"
secondaryBackgroundColor = "#1C2742"
textColor = "#E5E7EB"
primaryColor = "#818CF8"
linkColor = "#A5B4FC"
borderColor = "#2A3550"
dataframeHeaderBackgroundColor = "#1C2742"

[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 100
address = "127.0.0.1"
enableStaticServing = true
# 처음 실행할 때 터미널이 "Email:" 입력을 기다리며 멈춘 것처럼 보이지 않게 한다(#10).
# headless와 달리 브라우저 자동 열림은 그대로 둔다.
showEmailPrompt = false

[logger]
# Streamlit 자체의 "Help agents write better apps" 안내를 끈다. 한글 Windows에서
# Install을 누르면 cp949 오류 팝업이 뜬다(#11). 주소 안내는 시작 스크립트가 출력한다.
hideWelcomeMessage = true

[browser]
gatherUsageStats = false
